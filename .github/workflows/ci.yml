name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  windows:
    # A cargo-release commit ("Release vX.Y.Z") is pushed together with its tag,
    # and release.yml runs this workflow for that tag. Skip the duplicate branch run.
    # When called from release.yml the ref is the tag, so that run is kept.
    if: >-
      github.event_name != 'push' ||
      github.ref_type == 'tag' ||
      !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
      - name: release
        run: cargo build --release --locked
