name: ci

on:
  # Feature branches are checked through their pull request only; pushing to a
  # branch with an open PR would otherwise start a second, identical run.
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to the same PR supersedes the run in progress. Runs on main and
# release tags always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    # A cargo-release commit ("Release vX.Y.Z") is pushed together with its tag,
    # and release.yml runs this workflow for that tag. Skip the duplicate branch run.
    # When called from release.yml the ref is the tag, so that run is kept.
    if: >-
      github.event_name != 'push' ||
      github.ref_type == 'tag' ||
      !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --locked
      - name: release
        run: cargo build --release --locked
