[package]
name = "skrivli"
version = "0.1.8"
edition = "2021"
description = "Local Windows meeting recorder"
publish = false
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
cpal = "0.16"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
flexaudio = "0.8"
gpui-kit = "=0.9.0"
hex = "0.4"
rubato = { version = "5", default-features = false, features = ["fft_resampler"] }
sonora = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "2"
windows-core = "0.58"
jiff = "0.2.39"
icu = "2.4"
rust-i18n = "4.2"
flac-codec = "1.3"

[build-dependencies]
cmake = "0.1"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "implement",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.release]
allow-branch = ["main"]
publish = false                       # not a crates.io crate
tag-name = "v{{version}}"
tag-message = "Skrivli {{version}}"
pre-release-commit-message = "Release v{{version}}"
pre-release-hook = ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"]
